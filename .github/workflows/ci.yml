  pack-and-install:
    needs: test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install the packed tarball into a clean consumer project
        run: |
          mkdir -p /tmp/consumer
          cp agent-broker-*.tgz /tmp/consumer/
          cd /tmp/consumer
          npm init -y
          npm install ioredis@^5
          npm install ./agent-broker-*.tgz
      - name: Run a real consumer smoke test against the packed tarball
        run: |
          cat > /tmp/consumer/test.mjs <<'EOF'
          import { createBroker } from "agent-broker";
          import { Redis } from "ioredis";
          const redis = new Redis("redis://localhost:6379/15");
          const broker = createBroker({ redis });
          const agent = await broker.register({ budgetKey: "ci-consumer-smoke", initialBudget: 100 });
          const result = await broker.requestPermission({ agentId: agent.agentId, target: "ci-smoke", estimatedCost: 10 });
          if (!result.allowed) { throw new Error("expected admission, got: " + JSON.stringify(result)); }
          console.log("consumer smoke test passed:", result);
          await redis.quit();
          EOF
          cd /tmp/consumer && node test.mjs