# Publishes the Python package to PyPI when a tag like python-v0.1.0 is pushed.
# One-time setup (see RELEASE.md, "Publishing the Python package"):
#   1. Create the project on PyPI and add this repo + workflow as a Trusted Publisher.
#   2. Create a GitHub environment named "pypi".
name: Publish Python
on:
  push:
    tags: ["python-v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
