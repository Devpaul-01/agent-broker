name: Python

on:
  push:
    paths:
      - "python/**"
      # The Lua scripts in python/ are diffed against the TypeScript sources by a unit test
      # (python/tests/unit/test_script_equivalence.py), and test_public_api.py reads
      # typescript/src/index.ts, so TypeScript source changes can break Python tests.
      - "typescript/src/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "typescript/src/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: python

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Type check (mypy --strict)
        run: python -m mypy --strict src/agent_broker
      - name: Unit tests (no Redis required)
        run: python -m pytest tests/unit -v
      - name: Integration tests (real Redis)
        run: python -m pytest tests/integration -v

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the built wheel into a clean environment and import it
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install dist/*.whl
          /tmp/consumer/bin/python -c "import agent_broker; print('agent_broker', agent_broker.__version__, 'imported OK')"
