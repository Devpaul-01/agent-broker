name: Cross-language

# Proves the TypeScript and Python implementations interoperate through one shared Redis. This is
# a separate workflow because it needs both toolchains and must re-run when EITHER side changes.

on:
  push:
    paths:
      - "typescript/**"
      - "python/**"
      - "test/cross-language/**"
      - ".github/workflows/cross-language.yml"
  pull_request:
    paths:
      - "typescript/**"
      - "python/**"
      - "test/cross-language/**"
      - ".github/workflows/cross-language.yml"
  workflow_dispatch:

concurrency:
  group: cross-language-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-language:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install TypeScript dependencies
        run: npm ci
        working-directory: typescript
      - name: Install Python package with dev dependencies
        run: python -m pip install -e "python[dev]"
      - name: Run cross-language tests
        run: python -m pytest test/cross-language/ -v
